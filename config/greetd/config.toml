# greetd — minimal Wayland login daemon (replaces SDDM; no X dependency).
# Runs the ReGreet graphical greeter on `cage` (a tiny wlroots kiosk compositor).
# ReGreet shows a wallpaper, remembers the last username, and lists sessions.
[terminal]
vt = 1

[default_session]
command = "cage -s -- regreet"
user = "greeter"
